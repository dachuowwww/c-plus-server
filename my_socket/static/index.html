<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 铨欣铨意云盘</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
            background:
                radial-gradient(circle at top left, rgba(79,124,255,0.18), transparent 30%),
                radial-gradient(circle at bottom right, rgba(90,180,255,0.16), transparent 28%),
                linear-gradient(135deg, #eef4ff 0%, #f8fbff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(6px);
            border-radius: 22px;
            box-shadow: 0 20px 50px rgba(31, 41, 55, 0.12);
            padding: 36px 30px;
        }

        .brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand h1 {
            margin: 0;
            font-size: 28px;
            color: #1e3a8a;
        }

        .brand p {
            margin: 10px 0 0;
            font-size: 14px;
            color: #6b7280;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            color: #374151;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #dbe3f0;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease;
            background: #fff;
        }

        .form-group input:focus {
            border-color: #4f7cff;
            box-shadow: 0 0 0 4px rgba(79, 124, 255, 0.12);
        }

        .submit-btn {
            width: 100%;
            border: none;
            background: linear-gradient(135deg, #4f7cff, #6aa8ff);
            color: #fff;
            padding: 13px 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 24px rgba(79, 124, 255, 0.28);
        }

        .extra {
            margin-top: 18px;
            text-align: center;
        }

        .guest-link {
            display: inline-block;
            text-decoration: none;
            color: #4f7cff;
            font-size: 14px;
            padding: 10px 14px;
            border-radius: 10px;
            transition: background 0.2s ease;
        }

        .guest-link:hover {
            background: #eef4ff;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand">
            <h1>铨欣铨意云盘</h1>
            <p>欢迎登录文件管理系统</p>
        </div>

        <form action="/login" method="post">
            <div class="form-group">
                <label for="username">用户名</label>
                <input id="username" type="text" name="username" placeholder="请输入用户名" required>
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input id="password" type="password" name="password" placeholder="请输入密码" required>
            </div>

            <button class="submit-btn" type="submit">登录</button>
        </form>

        <div class="extra">
            <a class="guest-link" href="/anom">密码错误？使用游客模式访问</a>
        </div>
    </div>
</body>
</html>
