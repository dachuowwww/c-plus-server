syntax = "proto3";

package rpc_example;

// 用户信息消息（保留兼容性）
message UserInfo {
    int32 user_id = 1;
    string name = 2;
    string email = 3;
    int32 age = 4;
    bool is_active = 5;
}

// 获取用户请求
message GetUserRequest {
    int32 user_id = 1;
}

// 获取用户响应
message GetUserResponse {
    int32 user_id = 1;
    string name = 2;
    string email = 3;
    int32 age = 4;
    bool is_active = 5;
    string status_message = 6;
}

// 创建用户请求
message CreateUserRequest {
    string name = 1;
    string email = 2;
    int32 age = 3;
    bool is_active = 4;
}

// 创建用户响应
message CreateUserResponse {
    int32 user_id = 1;
    string name = 2;
    string email = 3;
    int32 age = 4;
    bool is_active = 5;
    string created_at = 6;
    string status_message = 7;
}

// 更新用户请求
message UpdateUserRequest {
    int32 user_id = 1;
    string name = 2;
    string email = 3;
    int32 age = 4;
    bool is_active = 5;
}

// 更新用户响应
message UpdateUserResponse {
    int32 user_id = 1;
    string name = 2;
    string email = 3;
    int32 age = 4;
    bool is_active = 5;
    string updated_at = 6;
    string status_message = 7;
}

// RPC请求消息
message RpcRequest {
    string service_name = 1;
    string method_name = 2;
    string serializer_type = 3;  // "protobuf" 或 "json"
    bytes request_data = 4;
    int64 request_id = 5;
}

// RPC响应消息
message RpcResponse {
    int64 request_id = 1;
    int32 status_code = 2;  // 0: 成功, 其他: 错误码
    string error_message = 3;
    bytes response_data = 4;
}

// 注意：我们不在.proto文件中定义service
// 因为我们的RPC框架是序列化格式无关的
// service定义由C++代码中的RpcServer::RegisterMethod来完成
// 
// 这样的设计允许：
// 1. 同一个服务方法支持多种序列化格式（JSON、Protobuf等）
// 2. 不绑定到特定的IDL，更加灵活
// 3. 可以渐进式地从一种序列化格式迁移到另一种 